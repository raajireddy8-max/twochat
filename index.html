<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>TwoChat Prototype</title><style>body{margin:0;background:#0d0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:20px;box-sizing:border-box}h1{font-size:32px}.card{background:#181820;border:1px solid #2b2b35;border-radius:20px;padding:20px;margin:14px 0}button,input{width:100%;box-sizing:border-box;padding:15px;border-radius:13px;border:0;margin-top:10px;font-size:16px}button{font-weight:700}input{background:#0e0e14;color:white;border:1px solid #393943}.secondary{background:#30303a;color:white}.msg{padding:11px 14px;background:#292932;border-radius:16px;margin:8px 0;max-width:80%}.me{margin-left:auto;background:white;color:#111}.hidden{display:none}.qr{height:180px;width:180px;margin:20px auto;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0/24px 24px;display:grid;place-items:center;color:#f00;font-weight:bold}</style></head><body><div class="app"><header><b>TwoChat</b> <small>🔐 private prototype</small></header><section id="home"><div class="card"><h1>Private chat for two.</h1><p>No phone number. No public profile. Prototype only.</p><button onclick="create()">Create my identity</button></div><div class="card"><b>Included</b><p>🔐 Local identity<br>🔗 Pairing flow<br>💬 Chat UI<br>⏱️ Disappearing-message demo<br>👥 Two-person conversation</p></div></section><section id="pair" class="hidden"><div class="card"><h2>Your identity</h2><p id="fp"></p></div><div class="card"><h2>Pair your partner</h2><div class="qr">PAIR</div><input id="code" placeholder="Partner pairing code"><button onclick="pair()">Pair devices</button></div></section><section id="chat" class="hidden"><div class="card"><h2>🔒 Private conversation</h2><div id="messages"></div><input id="msg" placeholder="Message…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div><div class="card"><b>Disappearing messages</b><button class="secondary" onclick="alert('Demo: 30-second timer enabled')">30 seconds</button><button class="secondary" onclick="alert('Demo: timer disabled')">Off</button></div></section></div><script>function show(x){for(const id of ['home','pair','chat'])document.getElementById(id).classList.toggle('hidden',id!==x)}async function create(){let b=new Uint8Array(16);crypto.getRandomValues(b);let fp=[...b].map(x=>x.toString(16).padStart(2,'0')).join(':').slice(0,23);localStorage.twoc=fp;document.getElementById('fp').textContent='Identity fingerprint: '+fp;show('pair')}function pair(){if(!document.getElementById('code').value.trim()){alert('Enter a partner code for this demo');return}localStorage.paired=1;show('chat');add('Partner paired. 🔒',false)}function add(t,me){let d=document.createElement('div');d.className='msg'+(me?' me':'');d.textContent=t;document.getElementById('messages').appendChild(d)}function send(){let i=document.getElementById('msg');if(i.value.trim()){add(i.value.trim(),true);i.value=''}}if(localStorage.paired)show('chat');else if(localStorage.twoc){document.getElementById('fp').textContent='Identity fingerprint: '+localStorage.twoc;show('pair')}</script></body></html>
